# Release notes for GitHub releases, generated by git-cliff.
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
{% if version and previous.version %}
**Full changelog**: https://github.com/flynnt-io/flynnt-agent-install/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
# Commits from before the switch to Conventional Commits are left out.
filter_unconventional = true
protect_breaking_commits = true
# The HTML comments only set the order of the groups.
commit_parsers = [
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Bug fixes" },
    { message = "^docs", group = "<!-- 3 -->Documentation" },
    { message = "^(refactor|test|chore)", group = "<!-- 4 -->Maintenance" },
]
filter_commits = true
sort_commits = "oldest"
